<section class="page-head">
  <p class="eyebrow">Roster</p>
  <h1>My Heroes</h1>
  <p class="lede">Pick a hero to inspect their profile.</p>
</section>

<ng-container *atom="heroes as heroList">
  @if (heroList?.length) {
    <div class="hero-list">
      @for (hero of heroList; track hero.id) {
        <a class="hero-row" [routerLink]="['/details', hero.id]">
          <span class="avatar" [style.--hue]="hue(hero.id)">{{ initials(hero.name) }}</span>
          <span class="hero-row__name">{{ hero.name }}</span>
          <span class="pill">#{{ hero.id }}</span>
          <span class="chevron" aria-hidden="true">→</span>
        </a>
      }
    </div>
  } @else {
    <div class="empty">Loading the roster…</div>
  }
</ng-container>
