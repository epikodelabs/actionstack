name: test & coverage

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 12 (the lockfile is generated by local npm 12)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Install browser binaries for testify
        run: node scripts/install-test-browser.mjs

      - name: Run tests with coverage
        run: npm run jasmine:coverage

      # Public repository: Codecov accepts tokenless uploads. Add a repo
      # CODECOV_TOKEN secret and pass `token:` for higher rate limits.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
