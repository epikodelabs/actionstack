name: test & coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 12 (the lockfile is generated by local npm 12)
        run: npm install -g npm@12

      - name: Install dependencies
        run: npm ci

      - name: Install browser binaries for testify
        run: node scripts/install-test-browser.mjs

      - name: Run tests with coverage
        run: npm run jasmine:coverage

      # Codecov requires a token for uploads to protected branches, even on
      # public repositories. Set the CODECOV_TOKEN secret (repo upload token
      # from codecov.io) for reports to land; the job stays green without it.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
